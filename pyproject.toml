[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acdp-verifier"
version = "0.1.0"
description = "Independent Python implementation of the ACDP verification core (second implementation for spec Final promotion)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    # Not a PyPI package by design — see README "Distribution". PyPI's upload
    # endpoint rejects any distribution carrying a `Private ::` classifier, so
    # an accidental publish fails at the registry rather than succeeding
    # quietly. setuptools accepts the prefix locally, so builds still work.
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py"
Source = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py"
Specification = "https://github.com/agentcontextdistributionprotocol/agentcontextdistributionprotocol"
Issues = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["acdp_verifier*"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["acdp_verifier", "run_conformance.py", "interop_check.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
