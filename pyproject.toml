[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acdp-verifier"
version = "0.1.0"
description = "Independent Python implementation of the ACDP verification core (second implementation for spec Final promotion)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    # Not a PyPI package by design — see README "Distribution". PyPI's upload
    # endpoint rejects any distribution carrying a `Private ::` classifier, so
    # an accidental publish fails at the registry rather than succeeding
    # quietly. setuptools accepts the prefix locally, so builds still work.
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50.0.1",
]

[project.urls]
Homepage = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py"
Source = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py"
Specification = "https://github.com/agentcontextdistributionprotocol/agentcontextdistributionprotocol"
Issues = "https://github.com/agentcontextdistributionprotocol/acdp-verifier-py/issues"

[project.optional-dependencies]
# ruff is pinned exactly (not >=): a linter's rule set changes between
# releases, so a floor here would let a future ruff release turn this
# repo's CI red with no commit of ours to blame.
# coverage[toml] makes the TOML-config dependency explicit; it is a no-op
# on Python >= 3.11, where tomllib is stdlib and coverage reads this file
# natively.
dev = ["pytest>=9.1.1", "mypy>=2.3.1", "ruff==0.16.6", "coverage[toml]>=7.16.0"]

[tool.setuptools.packages.find]
include = ["acdp_verifier*"]

[tool.mypy]
strict = true
python_version = "3.11"
files = [
    "acdp_verifier",
    "run_conformance.py",
    "interop_check.py",
    "interop_check_cosignature.py",
    "tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "C4", "SIM", "RUF", "DTZ", "EXE", "PIE", "PT", "RET", "TID"]
# E501: ruff format owns line length; enabling both makes the formatter and
# the linter fight over strings/comments the formatter cannot split.
# W191: ruff format owns indentation; enabling both invites the same kind
# of formatter/linter conflict as E501 (ruff's own docs recommend against
# pairing W191 with the formatter).
# RUF002/RUF003: this repo's docstrings deliberately quote the spec's own
# typography (x, arrow, en-dashes), so ambiguous-unicode warnings are noise.
# BLE is selected deliberately so the existing `# noqa: BLE001` markers stay
# meaningful — removing BLE from select would make those markers dead code.
ignore = ["E501", "W191", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["acdp_verifier"]
# In config, not a CI-only flag, so a local run and a CI run behave
# identically. This means data lands in .coverage.* files and
# `coverage combine` is required before `coverage report`.
parallel = true
# Deliberately not enabled: the gate measures statement coverage, and
# turning this on would change the measured number, invalidating the
# calibrated fail_under ratchet below. That should be a separate, deliberate
# decision, not a silent default flip.
branch = false

[tool.coverage.report]
# Measured combined coverage (unit tests + conformance) is 83.97%
# (1372/1634 statements), identical on py3.11 and py3.14. 83 with
# precision 2 avoids a rounding trap at the default precision 0.
# This is a RATCHET: raise it when coverage genuinely improves, never
# lower it to make a red build green.
fail_under = 83
precision = 2
show_missing = true
