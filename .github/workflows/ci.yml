name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: conformance + tests + types
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the verifier
        uses: actions/checkout@v4
        with:
          path: acdp-verifier-py
      # The conformance runner reads golden fixtures from the canonical spec
      # checkout via --spec-dir. Pull it as a sibling so this repo genuinely
      # re-verifies against the spec's pinned vectors on every push — the whole
      # point of an independent second implementation.
      - name: Check out the ACDP spec
        uses: actions/checkout@v4
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          path: agentcontextdistributionprotocol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: acdp-verifier-py
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Conformance (independent re-derivation of every golden vector)
        working-directory: acdp-verifier-py
        run: python run_conformance.py --spec-dir ../agentcontextdistributionprotocol
      - name: Unit tests
        working-directory: acdp-verifier-py
        run: pytest -q
      - name: Types (mypy --strict)
        working-directory: acdp-verifier-py
        run: mypy
      - name: Interop self-check (offline sample)
        working-directory: acdp-verifier-py
        run: python interop_check.py samples/sig-001-publish-request.json --did-doc samples/test-producer-did.json
