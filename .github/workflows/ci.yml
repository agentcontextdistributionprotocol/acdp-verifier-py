name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: conformance + tests + types
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the verifier
        uses: actions/checkout@v7
        with:
          path: acdp-verifier-py
      # The conformance runner reads golden fixtures from the canonical spec
      # checkout via --spec-dir. Pull it as a sibling so this repo genuinely
      # re-verifies against the spec's pinned vectors on every push — the whole
      # point of an independent second implementation. Pinned deliberately so
      # a spec-repo push cannot change this repo's CI result without a commit
      # here: the runner FAILS (never skips) an unregistered fixture, so a new
      # fixture family must land together with its executor. The pin below is
      # bumped by the monthly bump-spec-ref automation.
      - name: Check out the ACDP spec (pinned)
        id: spec
        uses: agentcontextdistributionprotocol/acdp-ci/actions/checkout-spec@015910153b61c32abbe018afe85d44868897bf3b # v1
        with:
          ref: b8601e29d63d18af716b2999f146884557e382c7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: acdp-verifier-py
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Format (ruff format --check)
        working-directory: acdp-verifier-py
        run: ruff format --check .
      - name: Lint (ruff check, zero warnings)
        working-directory: acdp-verifier-py
        run: ruff check .
      - name: Clear stale coverage data
        working-directory: acdp-verifier-py
        # Must run before either coverage-producing step below (Conformance,
        # Unit tests), not just before whichever happens to run first. When
        # the `rm` lived inside the Conformance step, its correctness rested
        # on an invariant recorded only in a comment there: that Conformance
        # runs before Unit tests. Nothing enforced that. Reorder the two and
        # the `rm` wipes whichever ran first's data — today that surfaces as
        # a red build (75.15% < 83), merely misdiagnosed as a coverage
        # regression, but once either producer alone clears fail_under
        # (routine as coverage grows) the same reorder yields a *passing*
        # build silently measuring half of what it claims. A dedicated step
        # makes the ordering invariant explicit and order-independent.
        run: rm -f .coverage .coverage.*
      - name: Conformance (independent re-derivation of every golden vector)
        working-directory: acdp-verifier-py
        run: coverage run run_conformance.py --spec-dir ${{ steps.spec.outputs.path }}
      - name: Unit tests
        working-directory: acdp-verifier-py
        run: coverage run -m pytest -q
      - name: Coverage gate (fail_under from pyproject)
        working-directory: acdp-verifier-py
        # [tool.coverage.run] parallel = true means each `coverage run` above
        # writes its own .coverage.<host>.<pid>.<random> file rather than a
        # shared .coverage; a bare `coverage report` would auto-combine
        # destructively, so combining happens once, here, after both runs
        # have written their data. fail_under lives in [tool.coverage.report]
        # in pyproject.toml so a local run gates identically to CI; `coverage
        # report` reads it automatically and exits nonzero when the combined
        # total is below it.
        run: |
          coverage combine
          coverage report
      - name: Types (mypy --strict)
        working-directory: acdp-verifier-py
        run: mypy
      - name: Interop self-check (offline sample)
        working-directory: acdp-verifier-py
        run: python interop_check.py samples/sig-001-publish-request.json --did-doc samples/test-producer-did.json
      - name: Interop self-check (witness cosignature, offline sample)
        working-directory: acdp-verifier-py
        run: python interop_check_cosignature.py samples/witness-cosignature-py.json --did-doc samples/test-witness-did.json
      # samples/witness-cosignature-rs.json + witness-did-rs.json were minted by
      # acdp-rs's own WitnessSigner (test seed 32x0x08) and independently
      # self-verified there — the first artifact to cross the implementation
      # boundary (RFC-ACDP-0015 PY-4). Re-verifying it here on every push is
      # the actual interop evidence, not the one-off exchange.
      - name: Interop cross-check (witness cosignature minted by acdp-rs)
        working-directory: acdp-verifier-py
        run: python interop_check_cosignature.py samples/witness-cosignature-rs.json --did-doc samples/witness-did-rs.json
