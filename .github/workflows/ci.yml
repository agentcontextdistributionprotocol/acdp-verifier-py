name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: conformance + tests + types
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the verifier
        uses: actions/checkout@v7
        with:
          path: acdp-verifier-py
      # The conformance runner reads golden fixtures from the canonical spec
      # checkout via --spec-dir. Pull it as a sibling so this repo genuinely
      # re-verifies against the spec's pinned vectors on every push — the whole
      # point of an independent second implementation.
      - name: Check out the ACDP spec
        uses: actions/checkout@v7
        with:
          repository: agentcontextdistributionprotocol/agentcontextdistributionprotocol
          # Pinned so a spec-repo push cannot change this repo's CI result
          # without a commit here. Bump deliberately when adopting new
          # fixtures — the runner FAILS (never skips) an unregistered
          # fixture, so a new family must land with its executor.
          # (spec main HEAD as of 2026-08-30; SPEC-8b follow-up — RFC-ACDP-0016 §7
          # stops reproducing MACP's hash formula. Editorial prose only: no
          # fixture, schema, or wire change since 8911511.)
          ref: 21759799a44c81f55884913d306827b7cc7a01bb
          path: agentcontextdistributionprotocol
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: acdp-verifier-py
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Conformance (independent re-derivation of every golden vector)
        working-directory: acdp-verifier-py
        run: python run_conformance.py --spec-dir ../agentcontextdistributionprotocol
      - name: Unit tests
        working-directory: acdp-verifier-py
        run: pytest -q
      - name: Types (mypy --strict)
        working-directory: acdp-verifier-py
        run: mypy
      - name: Interop self-check (offline sample)
        working-directory: acdp-verifier-py
        run: python interop_check.py samples/sig-001-publish-request.json --did-doc samples/test-producer-did.json
      - name: Interop self-check (witness cosignature, offline sample)
        working-directory: acdp-verifier-py
        run: python interop_check_cosignature.py samples/witness-cosignature-py.json --did-doc samples/test-witness-did.json
      # samples/witness-cosignature-rs.json + witness-did-rs.json were minted by
      # acdp-rs's own WitnessSigner (test seed 32x0x08) and independently
      # self-verified there — the first artifact to cross the implementation
      # boundary (RFC-ACDP-0015 PY-4). Re-verifying it here on every push is
      # the actual interop evidence, not the one-off exchange.
      - name: Interop cross-check (witness cosignature minted by acdp-rs)
        working-directory: acdp-verifier-py
        run: python interop_check_cosignature.py samples/witness-cosignature-rs.json --did-doc samples/witness-did-rs.json
