version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Without this, Dependabot treats an unpinned `>=` floor on an
    # unpublished-to-PyPI package as a library and skips it as
    # already-satisfied — zero PRs, ever. `increase` forces the floor
    # (e.g. cryptography's) up to the latest compatible release instead.
    versioning-strategy: increase
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # `patterns` is required for a group to match anything; without it these
      # two never grouped, so the 2026-08-29 run emitted four separate PRs
      # (#8-#11) instead of one `major-updates` PR.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      major-updates:
        patterns: ['*']
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
